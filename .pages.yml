media: media
settings:
  merge: true
content:
  - name: toy-resources
    label: Toy 游戏资源
    type: collection
    path: toy/entries
    format: json
    filename:
      template: "{fields.autoId}.json"
      field: false
    view:
      primary: name
      fields: [name, group]
      search: [name, id, group, desc]
      sort: [name, id]
      default:
        sort: name
        order: asc
    fields:
      - name: id
        label: 资源 ID（自动维护）
        type: string
        hidden: true
        readonly: true
      - name: autoId
        label: 新建资源自动编号
        type: uuid
        hidden: true
        options:
          editable: false
          generate: false
      - name: name
        label: 游戏名称
        type: string
        required: true
      - name: group
        label: 分类
        type: select
        required: true
        options:
          values:
            - value: ios
              label: iOS 游戏
            - value: wow
              label: 魔兽世界
            - value: other
              label: 其他
      - name: desc
        label: 介绍
        type: text
      - name: type
        label: 资源类型（按分类自动补齐）
        type: string
        hidden: true
        readonly: true
      - name: icon
        label: 图标（按分类自动补齐）
        type: string
        hidden: true
        readonly: true
      - name: tags
        label: 标签
        type: string
        list: true
      - name: url
        label: 资源直达链接
        type: string
      - name: linkItems
        label: 下载链接（任意添加、删除、排序）
        type: object
        description: 每一项填写显示名称和完整地址，可重复使用相同名称
        list:
          collapsible:
            collapsed: true
            summary: "{name}"
        fields:
          - name: name
            label: 显示名称（如百度网盘、备用下载1）
            type: string
            required: true
          - name: url
            label: 下载链接（HTTPS）
            type: string
            required: true
  - name: toy-categories
    label: Toy 分类设置
    type: file
    path: toy/categories.json
    format: json
    list: true
    fields:
      - name: id
        label: 分类 ID
        type: string
        required: true
      - name: name
        label: 分类名称
        type: string
        required: true
      - name: caption
        label: 分类说明
        type: string
      - name: icon
        label: 分类图标
        type: string
